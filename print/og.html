<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=DM+Sans:wght@700&family=Playfair+Display:ital,wght@0,600;1,500&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: "DM Sans", sans-serif; background: radial-gradient(700px 500px at 82% 30%, rgba(246,214,140,.75), transparent 65%), linear-gradient(135deg, #fbf6ec, #f3e7cf); position: relative; }
  .copy { position: absolute; left: 76px; top: 92px; width: 640px; }
  .eyebrow { font-size: 17px; letter-spacing: .26em; text-transform: uppercase; color: #85601a; font-weight: 700; display: flex; align-items: center; gap: 14px; }
  .eyebrow::before { content: ""; width: 40px; height: 2px; background: #c99a3e; }
  h1 { font-family: "Playfair Display", serif; font-weight: 600; font-size: 74px; line-height: 1.02; color: #1b2340; margin: 22px 0 18px; letter-spacing: -.01em; }
  h1 span { color: #a97c26; }
  .script { font-family: "Caveat", cursive; font-size: 44px; color: #1d3a7a; line-height: 1.05; }
  .meta { margin-top: 30px; display: inline-flex; align-items: center; gap: 12px; background: #0f1f44; color: #fff; padding: 14px 22px; border-radius: 999px; font-size: 19px; }
  .meta i { font-style: normal; color: #e6c27a; }
  .book { position: absolute; right: 120px; top: 70px; width: 330px; transform: rotate(4deg); }
  .book img { width: 100%; border-radius: 4px 10px 10px 4px; box-shadow: 30px 40px 60px -20px rgba(15,31,68,.55); }
  .head { position: absolute; right: 360px; bottom: 54px; width: 168px; height: 168px; border-radius: 50%; overflow: hidden; box-shadow: 0 0 0 7px #fffdf7, 0 0 0 9px #c99a3e, 0 20px 40px -12px rgba(15,31,68,.5); }
  .head img { width: 100%; height: 100%; object-fit: cover; }
  .bar { position: absolute; left: 0; right: 0; bottom: 0; height: 10px; background: linear-gradient(90deg, #2b4f98, #c99a3e, #e6c27a, #c99a3e, #2b4f98); }
</style>
</head>
<body>
  <div class="copy">
    <div class="eyebrow">Author · Speaker · Advocate</div>
    <h1>Jennifer A.<br><span>Schmeisser</span></h1>
    <div class="script">Not the life I planned…<br>but the one I was meant to live.</div>
    <div class="meta"><i>✦</i> New memoir: When the Blueprint Burned</div>
  </div>
  <div class="book"><img src="../docs/assets/img/book-cover-600.jpg" alt=""></div>
  <div class="head"><img src="../docs/assets/img/jennifer-headshot.jpg" alt=""></div>
  <div class="bar"></div>
</body>
</html>
